{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GoFuel{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
    <link rel="stylesheet" href="{% static 'core/theme.css' %}">
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
        defer
    ></script>
    <script src="{% static 'core/location.js' %}" defer></script>
</head>
<body data-stations-api="{% url 'api:stations' %}">
    <div class="page-shell">
        {% if messages %}
        <div class="flash-stack">
            {% for message in messages %}
            <div class="flash-message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <nav class="bottom-nav">
        <ul class="nav-list">
            <li class="nav-item">
                <a href="{% url 'core:landing' %}" class="nav-link{% if request.resolver_match.url_name == 'landing' %} active{% endif %}">
                    <span class="nav-icon">🏠</span>
                    Home
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'core:account' %}" class="nav-link{% if request.resolver_match.url_name == 'account' %} active{% endif %}">
                    <span class="nav-icon">👤</span>
                    Account
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'core:order' %}" class="nav-link{% if 'order' in request.resolver_match.url_name or 'dispenser' in request.resolver_match.url_name or 'fuel' in request.resolver_match.url_name or 'payment' in request.resolver_match.url_name %} active{% endif %}">
                    <span class="nav-icon">⛽</span>
                    Order
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'core:prices' %}" class="nav-link{% if request.resolver_match.url_name == 'prices' %} active{% endif %}">
                    <span class="nav-icon">💰</span>
                    Prices
                </a>
            </li>
        </ul>
    </nav>
    <script src="{% static 'core/location.js' %}" defer></script>
    <script>
        function showLoading(form) {
            const btn = form.querySelector('#submit-btn');
            const spinner = form.querySelector('#spinner');
            if (btn && spinner) {
                btn.classList.add('loading');
                spinner.style.display = 'inline-block';
            }
        }

        function validateForm(form) {
            const quantityInput = form.querySelector('input[name="quantity_litres"]');
            if (quantityInput) {
                const value = parseFloat(quantityInput.value);
                if (value <= 0 || value > 100) {
                    alert('Quantity must be between 0.1 and 100 liters.');
                    return false;
                }
            }
            showLoading(form);
            return true;
        }
    </script>
</body>
</html>
